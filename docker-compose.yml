services:
  postgres:
    image: postgres:16-alpine
    container_name: zkteco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biometric
      POSTGRES_USER: biometric
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biometric_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - biometric_admin_data:/var/lib/postgresql/data
      - ./zkteco-admin-api/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biometric -d biometric"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: zkteco-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-listener:
    build: ./zkteco-auth-listener
    container_name: zkteco-auth-listener
    restart: unless-stopped
    ports: ["8083:8082"]
    environment:
      RABBITMQ_HOST: rabbitmq
      DMT_BACKEND_URL: http://admin-api:8000
      LISTENER_API_KEY: ${LISTENER_API_KEY:-local-development-listener-key}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      admin-api: { condition: service_started }

  email-notifier:
    build: ./zkteco-email-notifier
    container_name: zkteco-email-notifier
    restart: unless-stopped
    ports: ["8084:8082"]
    env_file:
      - path: ./zkteco-email-notifier/.env
        required: false
    environment:
      SERVER_PORT: 8082
      TZ: America/Guayaquil
      RABBITMQ_HOST: rabbitmq
      DB_URL: jdbc:postgresql://postgres:5432/biometric
      DB_USERNAME: biometric
      DB_PASSWORD: ${DB_PASSWORD:-biometric_dev_password}
      DMT_BACKEND_URL: http://admin-api:8000
      LISTENER_API_KEY: ${LISTENER_API_KEY:-local-development-listener-key}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  cloud-relay:
    build: ./cloud-relay
    container_name: zkteco-cloud-relay
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: zkteco.auth.events
      CLOUD_API_URL: ${CLOUD_API_URL:-http://admin-api:8000}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-local-development-listener-key}
    depends_on:
      rabbitmq: { condition: service_healthy }
      admin-api: { condition: service_started }

  admin-api:
    build: ./zkteco-admin-api
    container_name: zkteco-admin-api
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://biometric:${DB_PASSWORD:-biometric_dev_password}@postgres:5432/biometric
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-before-production}
      LISTENER_API_KEY: ${LISTENER_API_KEY:-local-development-listener-key}
    depends_on:
      postgres: { condition: service_healthy }

  admin-web:
    build: ./zkteco-admin-web
    container_name: zkteco-admin-web
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [admin-api]

volumes:
  biometric_admin_data:
