server:
  port: ${SERVER_PORT:8082}
  tomcat:
    accesslog:
      enabled: true
      pattern: '%a %t "%r" %s %b'
spring:
  application:
    name: zkteco-auth-listener
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
zkteco:
  listener:
    protocol-mode: ${ZKTECO_PROTOCOL_MODE:DUAL}
    server-version: ${ZKTECO_SERVER_VERSION:3.0.1}
    push-protocol-version: ${ZKTECO_PUSH_PROTOCOL_VERSION:2.4.1}
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n'
